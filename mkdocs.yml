# Documentation site (GitHub Pages). Sources are assembled from the
# repository's Markdown by scripts/build-docs.py into target/docs-src.
site_name: ContextDB
site_description: A context database with invalidation proofs, shared by multiple AI coding agents.
site_url: https://zangjiucheng.github.io/ContextDB/
repo_url: https://github.com/zangjiucheng/ContextDB
repo_name: zangjiucheng/ContextDB
edit_uri: ""
docs_dir: target/docs-src
site_dir: target/docs-site
strict: false
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - 简体中文: README.zh-CN.md
  - Architecture: ARCHITECTURE.md
  - Specification: SPEC.md
  - Semantics to tests: SEMANTICS.md
  - Implementation status: IMPLEMENTATION_STATUS.md
  - Event log format: EVENTLOG.md
  - ADRs:
      - 0001 Semantic decisions: adr/0001-semantic-decisions.md
      - 0002 Sem head and branch isolation: adr/0002-sem-head-and-branch-isolation.md
      - 0003 P0 executable contract: adr/0003-p0-executable-contract.md
      - 0004 P1 maintenance: adr/0004-p1-maintenance.md
      - 0005 P1 memory budget: adr/0005-p1-memory-budget.md
      - 0006 P2 durable log: adr/0006-p2-durable-log.md
      - 0007 Incremental structural commits: adr/0007-incremental-structural-commits.md
      - 0008 P3 daemon, sessions, certificates: adr/0008-p3-daemon-sessions-certificates.md
      - 0009 P3 memory scopes: adr/0009-p3-memory-scopes-after-maintained-layers.md
      - 0010 P4 hooks and action gating: adr/0010-p4-hooks-action-gating.md
      - 0011 P5a file anchors: adr/0011-p5a-file-anchors.md
      - 0012 P5b symbol anchors: adr/0012-p5b-symbol-anchors.md
      - 0013 P6 branches and transactions: adr/0013-p6-branches-transactions.md
      - 0014 OpenCode harness: adr/0014-opencode-harness.md
  - Gates:
      - P0: gates/P0.md
      - P1: gates/P1.md
      - P2: gates/P2.md
      - P3: gates/P3.md
      - P4: gates/P4.md
      - P5a: gates/P5a.md
      - P5b: gates/P5b.md
      - P6: gates/P6.md
  - Changelog: CHANGELOG.md
