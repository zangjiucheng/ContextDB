# SPEC §3.2. Extend only when a low-level dependency is reviewed.
# Cargo metadata includes normal, build, dev, optional, and target-specific edges.
[core]
allowed_workspace = ["contextdb-model", "contextdb-oracle"]
# BLAKE3 runtime/platform dependencies and its C/assembly build helpers.
allowed_external = ["blake3", "arrayvec", "cfg-if", "constant_time_eq", "cpufeatures", "libc", "cc", "find-msvc-tools", "shlex"]

# ADR 0006 §1 review note (not enforced by the core check): contextdb-store may use
# rusqlite (bundled SQLite, public domain; MIT wrapper) for rebuildable projections
# only. The op_log never goes through SQLite. nix (fs feature) provides plain
# fsync(2) for the "fullfsync off" measurement mode (ADR 0006 §10).
[store]
reviewed_external = ["rusqlite", "blake3", "nix"]

# ADR 0008 §1: ctxd uses std threads (no async runtime), nix for sockets, peer
# credentials, statfs and process checks, arc-swap for lock-free snapshot
# publication, and blake3 for payload hashes. IPC uses the model's Wire
# encoding, so serde stays out of the daemon.
[daemon]
reviewed_external = ["nix", "arc-swap", "blake3"]

# ADR 0008 §10: hand-rolled JSON-RPC over stdio (owner decision).
[mcp]
reviewed_external = ["serde", "serde_json"]

# ADR 0010 §1, §5: the wire protocol, lease discovery, client and the outbox,
# shared by the daemon (sweeper) and light clients; blake3 for stream ids and
# record hashes, nix (fs) for flock and plain fsync.
[proto]
reviewed_external = ["blake3", "nix"]

# ADR 0010 §1: ctx-hook parses harness JSON (serde_json) and hashes
# baselines (blake3); the outbox itself is in contextdb-proto.
[hooks]
reviewed_external = ["serde", "serde_json", "blake3"]

# ADR 0010 §1: toml parses policy.toml and gating.toml in the CLI only
# (parse + serde features, no serde_derive); serde_json edits harness hook
# configs (ctx hooks install); blake3 hashes the policy and gating sources.
[cli]
reviewed_external = ["toml", "serde_json", "blake3"]

# ADR 0010 §1: light clients must not link the store or SQLite.
[anchors]
reviewed_external = ["blake3", "nix", "sha1-checked", "sha2"]

# ADR 0012 §1: tree-sitter and the pinned grammars, observer-side only.
[symbols]
reviewed_external = ["blake3", "tree-sitter", "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-go"]

[light]
crates = ["contextdb-proto", "contextdb-hooks", "contextdb-anchors", "contextdb-symbols"]

# ADR 0012 §1: the daemon's live path never parses, so no grammar is linked
# into ctxd or the crates it and the hooks are built from.
[grammar_free]
crates = ["contextdb-daemon", "contextdb-anchors", "contextdb-proto", "contextdb-hooks", "contextdb-mcp"]
