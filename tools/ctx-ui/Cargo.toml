# ctx-ui: a local, read-only viewer of a ContextDB context graph. A separate
# workspace (like fuzz/) so it builds against the product crates without
# joining the product workspace or its dependency policy.
[package]
name = "ctx-ui"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
contextdb-model = { path = "../../crates/contextdb-model" }
contextdb-core = { path = "../../crates/contextdb-core" }
contextdb-store = { path = "../../crates/contextdb-store" }
contextdb-proto = { path = "../../crates/contextdb-proto" }
serde_json = "=1.0.151"

[workspace]
