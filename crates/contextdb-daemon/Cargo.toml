[package]
name = "contextdb-daemon"
description = "Single-writer daemon, snapshot publication, and local IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contextdb-model.workspace = true
contextdb-core.workspace = true
contextdb-store.workspace = true
contextdb-proto.workspace = true
nix = { version = "=0.30.1", default-features = false, features = ["fs", "socket", "user", "process", "signal"] }
arc-swap = "=1.9.3"
blake3 = "=1.8.7"

[dev-dependencies]
rand_chacha = "=0.9.0"
rand_core = "=0.9.5"

[target.'cfg(loom)'.dev-dependencies]
loom = "=0.7.2"
