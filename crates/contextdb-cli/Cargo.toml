[package]
name = "contextdb-cli"
description = "Command-line interface for ContextDB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contextdb-anchors.workspace = true
contextdb-model.workspace = true
contextdb-core.workspace = true
contextdb-oracle.workspace = true
contextdb-store.workspace = true
contextdb-daemon.workspace = true
contextdb-proto.workspace = true
toml = { version = "=1.1.2", default-features = false, features = ["parse", "std", "serde"] }
serde_json = "=1.0.151"
blake3 = "=1.8.7"

[dev-dependencies]
contextdb-testkit.workspace = true
contextdb-daemon.workspace = true

[[bin]]
name = "ctx"
path = "src/main.rs"
