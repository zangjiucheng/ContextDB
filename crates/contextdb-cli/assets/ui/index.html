<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContextDB</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>ContextDB</h1>
  <select id="branch" aria-label="Branch" hidden></select>
  <span id="epoch" class="muted"></span>
  <nav>
    <button id="tab-records" class="tab active" type="button">Records</button>
    <button id="tab-graph" class="tab" type="button">Graph</button>
    <button id="tab-timeline" class="tab" type="button">Timeline</button>
  </nav>
  <input id="search" type="search" placeholder="Search keys and abstracts…" autocomplete="off">
  <div id="chips"></div>
</header>
<main>
  <section id="records-view">
    <div id="recent"></div>
    <div id="records"></div>
  </section>
  <section id="graph-view" hidden>
    <div id="graph-tools">
      <label class="toggle">show
        <select id="focus" aria-label="Graph scope">
          <option value="0">the whole graph</option>
          <option value="1">1 hop around the selection</option>
          <option value="2">2 hops around the selection</option>
          <option value="3">3 hops around the selection</option>
        </select>
      </label>
      <label class="toggle"><input id="all-revs" type="checkbox"> all revisions</label>
      <button id="fit" class="tab" type="button">fit</button>
    </div>
    <svg id="graph" role="img" aria-label="Context graph">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z"></path>
        </marker>
      </defs>
      <g id="viewport"></g>
    </svg>
    <div id="legend"></div>
    <div id="empty" hidden>No records yet. Agents add them with <code>ctx_record</code>.</div>
  </section>
  <section id="timeline-pane" hidden>
    <label class="toggle"><input id="timeline-here" type="checkbox"> this branch only</label>
    <div id="timeline-view"></div>
  </section>
  <aside id="panel" hidden>
    <button id="close" type="button" aria-label="Close">×</button>
    <div id="detail"></div>
  </aside>
</main>
<div id="error" hidden></div>
<script src="/app.js"></script>
</body>
</html>
