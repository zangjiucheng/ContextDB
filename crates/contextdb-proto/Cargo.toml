[package]
name = "contextdb-proto"
description = "ctxd wire protocol, lease discovery and blocking client (no store, no async)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contextdb-model.workspace = true
contextdb-core.workspace = true
blake3 = "=1.8.7"
nix = { version = "=0.30.1", default-features = false, features = ["fs", "socket", "user"] }

# ACLs (ADR 0017 §3.2): macOS extended ACLs through exacl; on Linux the
# POSIX ACL xattrs directly, so no libacl is needed to build.
[target.'cfg(target_os = "macos")'.dependencies]
exacl = "=0.13.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
xattr = { version = "=1.7.0", default-features = false }

[dev-dependencies]
rand_chacha = "=0.9.0"
rand_core = "=0.9.5"
