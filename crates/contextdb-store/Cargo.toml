[package]
name = "contextdb-store"
description = "Durable operation log, snapshots, and recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "=1.8.7"
contextdb-core.workspace = true
contextdb-model.workspace = true
# Rebuildable projections only (ADR 0006 §1); bundled SQLite is public domain.
rusqlite = { version = "=0.39.0", features = ["bundled"] }
# Plain fsync(2) for the "fullfsync off" measurement mode (ADR 0006 §10).
nix = { version = "=0.30.1", default-features = false, features = ["fs"] }
# ADR 0017 §8.1: encrypted packs for crypto-shred (one key per content hash),
# XChaCha20-Poly1305 from RustCrypto; keys and nonces from the OS (getrandom).
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
getrandom = "=0.3.4"

[dev-dependencies]
contextdb-oracle.workspace = true
contextdb-testkit.workspace = true
