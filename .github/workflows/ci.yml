name: Workspace checks

# Documentation-only changes skip the checks. The P5a G6 review package
# under docs/gates/p5a-g6/ is read by scripts/test_p5a_review.py, so it
# still triggers them. (Later patterns override earlier ones.)
on:
  push:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'docs/gates/p5a-g6/**'
      - '!LICENSE'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'docs/gates/p5a-g6/**'
      - '!LICENSE'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust 1.95.0 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Build, lint, test, and check dependency policy
        run: bash scripts/check.sh
      - name: CLI smoke check
        run: |
          cargo run --locked -p contextdb-cli --bin ctx -- --help
          cargo run --locked -p contextdb-cli --bin ctx -- --version
