name: Nightly exhaustive, mutation, durability, stress and fuzz gates (P1–P4)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - name: Depth 6 gate
        run: cargo test --release --locked -p contextdb-testkit --features contextdb-core/paranoid --test exhaustive -- --ignored --nocapture
      - name: Depth 8 report
        env:
          CONTEXTDB_EXHAUSTIVE_DEPTH: '8'
        run: cargo test --release --locked -p contextdb-testkit --features contextdb-core/paranoid --test exhaustive -- --ignored --nocapture
  mutation:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      # A runner tests about 15 mutants an hour, so each night covers 4 of 48
      # rotating shards (about 20 mutants each): all of them every 12 nights.
      # The full audit runs on the remote Linux host at gate time.
      - name: Kernel mutations (rotating shard)
        env:
          MUTATION_JOBS: '2'
          CARGO_BUILD_JOBS: '2'
          # Above the debug baseline with the P5a/P6 suites on a runner.
          MUTATION_TIMEOUT: '600'
        run: |
          k=$(( ($(date -u +%s) / 86400 * 4 + ${{ matrix.shard }}) % 48 ))
          echo "shard $k/48"
          rc=0; bash scripts/mutation.sh --shard "$k/48" || rc=$?
          # 0 all caught, 2 missed, 3 timeouts: missed mutants fail only when
          # no waiver in scripts/mutation-waivers.txt covers them.
          case $rc in
            0|2|3)
              cat results/p1-mutation/mutants.out/timeout.txt 2>/dev/null || true
              python3 scripts/mutation_missed.py results/p1-mutation ;;
            *) exit "$rc" ;;
          esac
  durability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - name: P2 G4 crash injection (1,000 per point) and PROP10 (10,000 seeds)
        env:
          CONTEXTDB_G4_RUNS: '1000'
          CONTEXTDB_PROP10_SEEDS: '10000'
        run: cargo test --release --locked -p contextdb-store
      - name: P2 rebuild == incremental and read modes
        run: cargo test --release --locked -p contextdb-testkit --test p2_rebuild
  p3-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - name: P3 G4 stress, 1/8/32/128 clients x 10 min
        run: bash scripts/stress.sh
      - name: P3 G4 crash injection incl. staged payloads and session log (1,000 per point)
        env:
          CONTEXTDB_G4_RUNS: '1000'
        run: cargo test --release --locked -p contextdb-store -p contextdb-daemon
  p3-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-10-01 --profile minimal
      - run: cargo +nightly-2026-10-01 install cargo-fuzz --version 0.13.2 --locked
      - name: P3/P4 G4 fuzzing, IPC, MCP JSON and the P4 parsers (1 h each, in parallel)
        env:
          FUZZ_JOBS: '2'
        run: bash scripts/fuzz.sh
  p4-hook-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - name: P4 G4 outbox stress, 8 streams x 16 ctx-hook processes x 10 min
        run: bash scripts/hook-stress.sh
  p4-mutation:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      # Rotating shards as for the kernel. A mutant that hangs the tests
      # (timeout) is caught; a missed one fails the job unless waived.
      - name: P4 mutations (rotating shard)
        env:
          MUTATION_JOBS: '2'
          CARGO_BUILD_JOBS: '2'
        run: |
          k=$(( ($(date -u +%s) / 86400 * 4 + ${{ matrix.shard }}) % 32 ))
          echo "shard $k/32"
          rc=0; bash scripts/mutation-p4.sh --shard "$k/32" || rc=$?
          # 0 all caught, 2 missed, 3 timeouts: missed mutants fail only when
          # no waiver in scripts/mutation-waivers.txt covers them.
          case $rc in
            0|2|3)
              cat results/p4-mutation/mutants.out/timeout.txt 2>/dev/null || true
              python3 scripts/mutation_missed.py results/p4-mutation ;;
            *) exit "$rc" ;;
          esac
